[package]
name = "mora-audio"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "mora-audio"
path = "src/main.rs"

[[bin]]
name = "mora-smtc"
path = "src/smtc.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
base64 = "0.22"
cpal = "0.16"
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Foundation", "Foundation_Collections", "Media", "Media_Control", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1

