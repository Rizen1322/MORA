name: iOS unsigned IPA

on:
  push:
    branches: [ios]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'package*.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Test native diagnostic WAV generator
        run: |
          swiftc apps/mobile/ios/App/App/NativeProbeWave.swift apps/mobile/test/native-wave/main.swift -o "$RUNNER_TEMP/mora-wave-check"
          "$RUNNER_TEMP/mora-wave-check"
      - name: Build unsigned device IPA
        run: sh apps/mobile/scripts/ios-mac.sh --ipa
      - name: Compare AutoMix DSP with native JavaScriptCore
        run: node apps/mobile/scripts/check-native-dsp.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MORA-unsigned-ipa
          path: apps/mobile/MORA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
