name: iOS unsigned IPA

on:
  push:
    branches: [ios]
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'package*.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run only the complete app UI startup check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.ui_only != true
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Test native diagnostic WAV generator
        run: |
          swiftc apps/mobile/ios/App/App/NativeProbeWave.swift apps/mobile/test/native-wave/main.swift -o "$RUNNER_TEMP/mora-wave-check"
          "$RUNNER_TEMP/mora-wave-check"
      - name: Test native prepared-track timeline
        run: |
          swiftc apps/mobile/ios/App/App/NativeMixTimeline.swift apps/mobile/test/native-timeline/main.swift -o "$RUNNER_TEMP/mora-timeline-check"
          "$RUNNER_TEMP/mora-timeline-check"
      - name: Test native artwork thumbnail decoder
        run: |
          swiftc apps/mobile/ios/App/App/NativeArtworkImage.swift apps/mobile/test/native-artwork/main.swift -o "$RUNNER_TEMP/mora-artwork-check"
          "$RUNNER_TEMP/mora-artwork-check"
      - name: Test native player state
        run: |
          swiftc apps/mobile/ios/App/App/NativePlayerState.swift apps/mobile/test/native-player/main.swift -o "$RUNNER_TEMP/mora-player-check"
          "$RUNNER_TEMP/mora-player-check"
      - name: Test native shell state
        run: |
          swiftc apps/mobile/ios/App/App/NativeShellState.swift apps/mobile/test/native-shell/main.swift -o "$RUNNER_TEMP/mora-shell-check"
          "$RUNNER_TEMP/mora-shell-check"
      - name: Build unsigned device IPA
        run: sh apps/mobile/scripts/ios-mac.sh --ipa
      - name: Test native UI bridge and recording replacement
        run: npx vitest run apps/mobile/test/native-mix-client.test.ts apps/server/test/yandex-wave.test.ts apps/web/test/native-ui.test.ts apps/web/test/native-versions.test.ts apps/web/test/native-controller.test.ts apps/server/test/library-dto.test.ts apps/server/test/yandex-catalog.test.ts apps/server/test/native-sources.test.ts
      - name: Compare compiled Rust MIR with the bundled analyzer
        run: node apps/mobile/scripts/check-native-rust-analysis.mjs
      - name: Test native media preparation
        run: |
          swiftc apps/mobile/ios/App/App/NativeProbeWave.swift apps/mobile/ios/App/App/NativePCMDecoder.swift apps/mobile/test/native-preparation/main.swift -o "$RUNNER_TEMP/mora-preparation-check"
          "$RUNNER_TEMP/mora-preparation-check"
      - name: Compare the Swift AutoMix mixer with Node
        run: node apps/mobile/scripts/check-native-dsp.mjs
      - name: Test native HTTP preparation transport
        run: node apps/mobile/scripts/check-native-http.mjs --long-analysis
      - name: Test the real native host in a background iOS app
        run: node apps/mobile/scripts/check-native-host.mjs
      - name: Test the native queue on PCM files
        run: node apps/mobile/scripts/check-native-mix.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MORA-unsigned-ipa
          path: apps/mobile/MORA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Launch the complete native app in the simulator
        run: |
          sh apps/mobile/scripts/build-rust-ios.sh iphonesimulator
          # WebKit bug 293831: simulator-only target override avoids its missing Swift overlay.
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/mora-ui" \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=18.4 build > "$RUNNER_TEMP/mora-ui-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/mora-ui-build.log"; exit 1; }
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for a in json.load(sys.stdin)["devices"].values() for d in a if "iPhone" in d["name"]))')
          codesign --force --deep --sign - "$RUNNER_TEMP/mora-ui/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/mora-ui/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch --console --terminate-running-process "$DEVICE" ru.mora.player > "$RUNNER_TEMP/mora-ui-console.log" 2>&1 &
          LAUNCH_PID=$!
          sleep 20
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/mora-native-home.png"
          kill -0 "$LAUNCH_PID" || { cat "$RUNNER_TEMP/mora-ui-console.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: MORA-native-ui-check
          path: |
            ${{ runner.temp }}/mora-native-home.png
            ${{ runner.temp }}/mora-ui-console.log
          if-no-files-found: error

  ui:
    if: inputs.ui_only == true
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Prepare app
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
          npm run build -w @automix/mobile
          sh apps/mobile/scripts/build-rust-ios.sh iphonesimulator
          (cd apps/mobile && npx cap sync ios)
      - name: Build simulator app
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/mora-ui-devices.json"
          DEVICE=$(python3 -c 'import json,sys; rows=[d for r,a in json.load(open(sys.argv[1]))["devices"].items() if r.endswith("iOS-26-2") for d in a if "iPhone" in d["name"]]; assert rows, "iOS 26.2 simulator is required for Liquid Glass verification"; print(next((d["udid"] for d in rows if d["name"] == "iPhone 17 Pro"), rows[0]["udid"]))' "$RUNNER_TEMP/mora-ui-devices.json")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/mora-ui" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET=18.4 build > "$RUNNER_TEMP/mora-ui-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/mora-ui-build.log"; exit 1; }
      - name: Launch app and verify it stays alive
        run: |
          APP="$RUNNER_TEMP/mora-ui/Build/Products/Debug-iphonesimulator/App.app"
          codesign --force --deep --sign - "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --console --terminate-running-process "$DEVICE" ru.mora.player > "$RUNNER_TEMP/mora-ui-console.log" 2>&1 &
          LAUNCH_PID=$!
          sleep 30
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/mora-native-home.png"
          kill -0 "$LAUNCH_PID" || { cat "$RUNNER_TEMP/mora-ui-console.log"; exit 1; }
          xcrun simctl spawn "$DEVICE" launchctl list | grep ru.mora.player > "$RUNNER_TEMP/mora-ui-process.txt"
          cat "$RUNNER_TEMP/mora-ui-console.log"
      - name: Collect simulator diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mora-ui-diagnostics"
          cp "$RUNNER_TEMP"/mora-ui-*.log "$RUNNER_TEMP/mora-ui-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/mora-ui-devices.json "$RUNNER_TEMP/mora-ui-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/mora-ui-process.txt "$RUNNER_TEMP"/mora-native-home.png "$RUNNER_TEMP/mora-ui-diagnostics/" 2>/dev/null || true
          if [ -n "$DEVICE" ]; then
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "App" OR eventMessage CONTAINS "ru.mora.player"' > "$RUNNER_TEMP/mora-ui-diagnostics/runtime.log" 2>&1 || true
          fi
          find "$HOME/Library/Logs/DiagnosticReports" -name 'App*' -exec cp {} "$RUNNER_TEMP/mora-ui-diagnostics/" \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MORA-ui-diagnostics
          path: ${{ runner.temp }}/mora-ui-diagnostics
          if-no-files-found: error
